<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Carrossel</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; background: #000; overflow: hidden; }
  .carousel { position: relative; width: 100vw; height: 100vh; }
  .slide { position: absolute; inset: 0; opacity: 0; transition: opacity 0.6s ease; display: flex; align-items: center; justify-content: center; }
  .slide.active { opacity: 1; }
  .slide img { max-width: 100%; max-height: 100%; }
  .nav { position: absolute; top: 50%; transform: translateY(-50%); background: rgba(0,0,0,0.4); color: #fff; border: none; font-size: 28px; padding: 10px 16px; cursor: pointer; border-radius: 8px; }
  .nav:hover { background: rgba(0,0,0,0.7); }
  .prev { left: 12px; }
  .next { right: 12px; }
  .dots { position: absolute; bottom: 16px; left: 0; right: 0; display: flex; justify-content: center; gap: 8px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: rgba(255,255,255,0.4); cursor: pointer; }
  .dot.active { background: #fff; }
</style>
</head>
<body>
  <div class="carousel">
      <div class="slide active"><img src="img_0.png" alt="Imagem 1"></div>
      <div class="slide"><img src="img_1.png" alt="Imagem 2"></div>
      <div class="slide"><img src="img_2.png" alt="Imagem 3"></div>
    <button class="nav prev" onclick="prevSlide()">&#10094;</button>
    <button class="nav next" onclick="nextSlide()">&#10095;</button>
    <div class="dots">
      <span class="dot active" onclick="goTo(0)"></span>
      <span class="dot" onclick="goTo(1)"></span>
      <span class="dot" onclick="goTo(2)"></span>
    </div>
  </div>
<script>
  var slides = document.querySelectorAll('.slide');
  var dots = document.querySelectorAll('.dot');
  var current = 0;
  var total = slides.length;
  var timer;

  function show(i) {
    slides[current].classList.remove('active');
    dots[current].classList.remove('active');
    current = (i + total) % total;
    slides[current].classList.add('active');
    dots[current].classList.add('active');
  }
  function nextSlide() { show(current + 1); resetTimer(); }
  function prevSlide() { show(current - 1); resetTimer(); }
  function goTo(i) { show(i); resetTimer(); }
  function resetTimer() {
    clearInterval(timer);
    if (total > 1) timer = setInterval(nextSlide, 5000);
  }
  resetTimer();
</script>
</body>
</html>
